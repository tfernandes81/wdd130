<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Questionário de HTML e CSS</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Questionário de HTML e CSS</h1>

  <form action="" method="post">
    <div class="campo">
      <label for="q1">1. O que significa a sigla CSS?</label>
      <input type="text" name="q1" id="q1">
    </div>

    <div class="campo">
      <label for="q2">2. Como os atributos `id` e `class` são selecionados no CSS?</label>
      <textarea name="q2" id="q2" rows="5"></textarea>
    </div>

    <div class="campo">
      <label for="q3">3. Qual das opções abaixo é um comentário CSS válido?</label>
      <select name="q3" id="q3">
        <option value="">Escolha uma...</option>
        <option value="html">&lt;!-- comentário --&gt;</option>
        <option value="css">/* comentário */</option>
        <option value="js">// comentário</option>
      </select>
    </div>

    <div class="campo">
      <label for="q4">4. Qual é a margem inferior dada por esta declaração?</label>
      <pre><code>margin: 10px 5px 15px;</code></pre>
      <input type="number" name="q4" id="q4">
    </div>

    <button type="submit">Enviar Questionário</button>
  </form>
</body>
</html>
