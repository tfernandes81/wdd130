<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fale Conosco | Empresa de Rafting</title>
    <meta name="description" content="Entre em contato com a Empresa de Rafting: endereço, telefone, e-mail e formulário de contato para dúvidas, reservas e sugestões.">
    <meta name="author" content="Tiago Gonçalves Fernandes">
    <link rel="stylesheet" href="estilos/rafting.css">
</head>
<body>
    <header>
        <img src="imagens/logo.png" alt="Logo da Empresa de Rafting">
        <nav>
            <a href="index.html">Página Inicial</a>
            <a href="sobre.html">Sobre Nós</a>
            <a href="passeios.html">Passeios</a>
            <a href="contato.html">Fale Conosco</a>
        </nav>
    </header>

    <main>
        <section class="contato-info">
            <h1>Companhia de Rafting em Corredeiras</h1>
            <p>123 Rua Principal do Rio</p>
            <p>Foz do Iguaçu, Paraná</p>
            <p>+55 45 99999-9999</p>
            <p>info@correiras.com</p>
        </section>

        <section class="contato-mapa-form">
            <div class="mapa">
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d14733.0!2d-54.585!3d-25.512!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1"
                    width="100%"
                    height="300"
                    style="border:0;"
                    allowfullscreen=""
                    loading="lazy"
                    referrerpolicy="no-referrer-when-downgrade"
                    title="Mapa da localização da empresa">
                </iframe>
            </div>

            <form action="#" method="post" class="form-contato">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" placeholder="Digite aqui" required>

                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="Digite aqui" required>

                <fieldset class="proposito">
                    <legend>Propósito da Mensagem</legend>
                    <label>
                        <input type="radio" name="proposito" value="duvida-geral" checked>
                        Consulta Geral
                    </label>
                    <label>
                        <input type="radio" name="proposito" value="pergunta-reserva">
                        Pergunta sobre Reserva
                    </label>
                    <label>
                        <input type="radio" name="proposito" value="sugestao">
                        Sugestão de Site
                    </label>
                </fieldset>

                <label for="mensagem">Mensagem</label>
                <textarea id="mensagem" name="mensagem" rows="5" placeholder="Digite aqui"></textarea>

                <label class="checkbox-label">
                    <input type="checkbox" id="newsletter" name="newsletter">
                    Quero receber a newsletter mensal
                </label>

                <button type="submit">Entrar em Contato!</button>
            </form>
        </section>

        <section class="equipe">
            <h2>Estamos Aqui para Servi-lo</h2>
            <div class="galeria-equipe">
                <figure>
                    <img src="imagens/funcionario-1.jpg" alt="Foto de perfil do guia de rafting">
                    <figcaption>Guia de Rafting</figcaption>
                </figure>
                <figure>
                    <img src="imagens/funcionario-2.jpg" alt="Foto de perfil da recepcionista">
                    <figcaption>Recepcionista</figcaption>
                </figure>
                <figure>
                    <img src="imagens/funcionario-3.jpg" alt="Foto de perfil do instrutor de segurança">
                    <figcaption>Instrutor de Segurança</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy;2026 Empresa de Rafting Tiago Fernandes</p>
        <nav class="redes-sociais">
            <a href="https://facebook.com" target="_blank" rel="noopener noreferrer">
                <img src="imagens/facebook-icon.png" alt="Ícone do Facebook">
            </a>
            <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer">
                <img src="imagens/linkedin-icon.png" alt="Ícone do LinkedIn">
            </a>
            <a href="https://instagram.com" target="_blank" rel="noopener noreferrer">
                <img src="imagens/instagram-icon.png" alt="Ícone do Instagram">
            </a>
        </nav>
    </footer>
</body>
</html>
